name: Bug report
description: Something is broken or wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Level, colour, and the PGN of the game if it is about a game (Copy PGN button).
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Safari 18 on iPhone 15
